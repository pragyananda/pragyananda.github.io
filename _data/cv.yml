    Publications:
      - title: "AI-Monitors at SemEval-2026 Task 4: A Hybrid Embedding and LLM Ensemble for Narrative Similarity"
        authors:
          - Vishnu Tripathi
          - Prakhar Joshi
          - Pragyananda Sahoo
          - Gaurav Kumar
          - Piyush Arora
          - Neel Mani
          - and others
        publisher: Proceedings of the 20th International Workshop on Semantic Evaluation (SemEval-2026), ACL, pp. 2139-2148
        releaseDate: 2026-07-07
        summary: Determines which of two candidate stories is more narratively similar to an anchor. Structured few-shot prompting and an error-diversity ensemble reached 75% test accuracy, ranking 3rd of 47 systems, close to the 78% human annotator ceiling.

      - title: Marma Point Detection and Personalized Ayurvedic Diagnosis Using Computer Vision
        authors:
          - Pragyanand Sahoo
          - Neel Mani
          - Shastri Nimmagadda
          - Amit Das
        publisher: "Indian Knowledge System and Wellbeing: Proceedings of MBCC 2025, Volume 1, Springer Nature, p. 228"
        releaseDate: 2026-06-01
        summary: First-author paper. A methodology that analyses user images with body type (Vata, Pitta, Kapha), height, symptoms, and medical history to recommend personalised marma points for stress and anxiety therapy. Presented at the 2nd MBCC 2025 conference, IIT Mandi.

      - title: "AI-Monitors at GenAI Detection Task 1: Fast and Scalable Machine Generated Text Detection"
        authors:
          - Azad Singh
          - Vishnu Tripathi
          - Ravindra Kumar Pandey
          - Pragyanand Saho
          - Prakhar Joshi
          - Neel Mani
          - Richa Alagh
          - Pallaw Mishra
          - Piyush Arora
        publisher: Proceedings of the 1st Workshop on GenAI Content Detection (GenAIDetect), COLING 2025, Abu Dhabi, pp. 230-235
        releaseDate: 2025-01-19
        url: https://aclanthology.org/2025.genaidetect-1.25/
        summary: Fine-tuned RoBERTa and XLM-R models to detect machine-generated text. Careful choice of training epochs, input size, and class-imbalance handling gave a 5-6% absolute gain in accuracy and F1.

    Projects:
      - name: HistoAI - Ecosystem for Historical Books
        summary: End-to-end pipeline for digitising historical books, developed at CAIR Lab, DSVV and continued at SRHU - OCR with image extraction for degraded scans, structured data extraction, knowledge-graph generation, and a RAG chatbot over the collection.

      - name: Innopat - AI Patent Drafting Assistant
        summary: Turns claim lists and Invention Disclosure Forms into full patent specifications with RAG and LLMs; refined prompts for consistent terminology, PDF/DOCX parsing, and figure mappings.

      - name: Supreme Court Legal Case Matching System
        summary: Vector-based RAG with LLMs that identifies commonalities, semantic similarities, and legal precedents between newly filed and historical cases.

      - name: AURA - Tax Automation for Ride-share Drivers (Australia)
        summary: Accounting automation for UBER and DIDI drivers - extraction of ride-sharing activity statements, pipelines for CBA, NAB, and ANZ bank data, a BAS automation engine, transaction reconciliation, and Excel-integrated reporting.

      - name: DVAS
        url: https://dvas.vercel.app/
        summary: Freelance e-commerce store for eco-friendly areca palm leaf cutlery. Next.js 15, Tailwind CSS, Node.js, MongoDB.

      - name: UttarakhandTrips
        url: https://uttarakhandtrips.com/
        summary: Travel booking site migrated from WordPress to Django with payments, MySQL, and a REST API.

